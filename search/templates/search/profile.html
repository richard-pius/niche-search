{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-8">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <h2 class="text-2xl font-bold mb-6">👤 Edit Profile</h2>
        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700">Profile Picture</label>
                {% if user.profile.profile_picture %}
                    <img src="{{ user.profile.profile_picture.url }}" alt="Current" class="h-20 w-20 rounded-full object-cover mb-3 border-2 border-slate-200">
                {% endif %}
                <input type="file" name="profile_picture" class="mt-1 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
            </div>
            <div>
                <label for="id_username" class="block text-sm font-medium text-slate-700">Username</label>
                <input type="text" name="username" value="{{ user.username }}" id="id_username" class="mt-1 block w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-brand-500 focus:border-brand-500" required>
            </div>
            <div>
                <label for="id_email" class="block text-sm font-medium text-slate-700">Email</label>
                <input type="email" name="email" value="{{ user.email }}" id="id_email" class="mt-1 block w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-brand-500 focus:border-brand-500" required>
            </div>
            <button type="submit" class="w-full bg-brand-600 text-white py-3 rounded-lg font-semibold hover:bg-brand-700 transition">
                Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
