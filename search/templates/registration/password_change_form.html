{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <h2 class="text-2xl font-bold text-center mb-8">Change your password</h2>
    <form method="post" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-5">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-brand-600 text-white py-3 rounded-lg font-semibold hover:bg-brand-700 transition">
            Change password
        </button>
    </form>
</div>
{% endblock %}
